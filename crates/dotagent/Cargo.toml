[package]
name = "dotagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Polyglot agent orchestrator — write agents in any language, scheduled by the OS, monitored by dotagent."

[[bin]]
name = "dotagent"
path = "src/main.rs"

[dependencies]
dotagent-core.workspace = true
dotagent-scheduler.workspace = true
dotagent-runner.workspace = true
dotagent-state.workspace = true
dotagent-plugin.workspace = true
dotagent-mcp.workspace = true
dotagent-memory.workspace = true
dotagent-assistant.workspace = true
dotagent-notify.workspace = true
dotagent-secrets.workspace = true
dotagent-supervisor.workspace = true
dotagent-telemetry.workspace = true
dotagent-unit-gen.workspace = true

# "net" for the local API's Unix socket (tokio::net::UnixListener).
tokio = { workspace = true, features = ["net"] }
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait = "0.1"
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` gives the tests a pausable clock. The daemon-loop regression it
# exists for ("a slow scheduled run must not delay an inbound trigger") is a
# statement about time, and asserting it on the wall clock would either be
# flaky or take 20 minutes.
tokio = { workspace = true, features = ["test-util"] }
