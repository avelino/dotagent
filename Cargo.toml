[workspace]
resolver = "2"
members = [
  "crates/dotagent",
  "crates/dotagent-core",
  "crates/dotagent-scheduler",
  "crates/dotagent-runner",
  "crates/dotagent-state",
  "crates/dotagent-plugin",
  "crates/dotagent-mcp",
  "crates/dotagent-memory",
  "crates/dotagent-notify",
  "crates/dotagent-secrets",
  "crates/dotagent-supervisor",
  "crates/dotagent-telemetry",
  "crates/dotagent-unit-gen",
  "crates/dotagent-assistant",
  "plugins/preflight-warp",
  "plugins/preflight-cmd",
  "plugins/sink-roam",
  "plugins/sink-outl",
  "plugins/sink-file",
]
default-members = ["crates/dotagent"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["Avelino <avelinorun@gmail.com>"]
license = "MIT"
repository = "https://github.com/avelino/dotagent"
homepage = "https://github.com/avelino/dotagent"
readme = "README.md"

[workspace.dependencies]
# Internal crates
dotagent-core = { path = "crates/dotagent-core", version = "0.5.0" }
dotagent-scheduler = { path = "crates/dotagent-scheduler", version = "0.5.0" }
dotagent-runner = { path = "crates/dotagent-runner", version = "0.5.0" }
dotagent-state = { path = "crates/dotagent-state", version = "0.5.0" }
dotagent-plugin = { path = "crates/dotagent-plugin", version = "0.5.0" }
dotagent-mcp = { path = "crates/dotagent-mcp", version = "0.5.0" }
dotagent-memory = { path = "crates/dotagent-memory", version = "0.5.0" }
dotagent-notify = { path = "crates/dotagent-notify", version = "0.5.0" }
dotagent-secrets = { path = "crates/dotagent-secrets", version = "0.5.0" }
dotagent-supervisor = { path = "crates/dotagent-supervisor", version = "0.5.0" }
dotagent-telemetry = { path = "crates/dotagent-telemetry", version = "0.5.0" }
dotagent-unit-gen = { path = "crates/dotagent-unit-gen", version = "0.5.0" }
dotagent-assistant = { path = "crates/dotagent-assistant", version = "0.5.0" }

# Async runtime
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "fs",
  "io-util",
  # stdin/stdout for the MCP server's line-delimited transport.
  "io-std",
  "sync",
  "time",
  "signal",
] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging + telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "registry",
  "fmt",
] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic",
  "trace",
  "logs",
] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry-stdout = { version = "0.32", features = ["trace", "logs"] }
flate2 = "1"

# Errors
anyhow = "1"
thiserror = "2"

# HTTP (built-in notifiers + plugins)
# `webpki-roots` was a separate feature up to 0.13.1 and is gone from 0.13.4;
# `rustls` now brings the trust anchors on its own. Keeping the old feature
# pinned the lock to 0.13.1 and quietly blocked every patch release.
# Verified with a real TLS handshake against api.telegram.org before removing.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "form",
] }

# outl, embedded as the memory backend. Beta line: the whole outl
# workspace shares one version, so these three must move together.
# outl-core comes in for `NodeId` and `PropValue`: memory addresses a fact by
# its block id and stores provenance as block properties.
outl-ws = "0.11.0-beta"
outl-actions = "0.11.0-beta"
outl-core = "0.11.0-beta"

# Filesystem
dirs = "6"
fs2 = "0.4"

# Crypto
sha2 = "0.11"

# Unix system calls (process groups, signals)
libc = "0.2"

# Regex
regex = "1"

# Dev
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
