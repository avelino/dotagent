name: release

# Stable channel: triggered by `v*.*.*` tag pushes. Reuses `_build.yml`
# for the 4-platform matrix and `./.github/actions/update-formula` for
# the Homebrew formula bump.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - id: calc
        env:
          # On workflow_dispatch GITHUB_REF_NAME is the branch (main), so
          # the input has to win there. Passed through env, not inlined
          # into the script.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag must look like v1.2.3 (optionally v1.2.3-rc.1), got '${TAG}'"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed stable version: ${VERSION}"

  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      archive-prefix: dotagent-${{ needs.prepare.outputs.version }}
      ref: v${{ needs.prepare.outputs.version }}
      cache-key: stable

  release:
    name: publish github release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dotagent-*.tar.gz
            dotagent-*.tar.gz.sha256
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

  homebrew:
    name: refresh dotagent formula
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Always operate against `main` — tags are immutable and the
      # formula lives on the default branch where `brew tap` resolves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - uses: ./.github/actions/update-formula
        with:
          formula-path: Formula/dotagent.rb
          marker-prefix: DOTAGENT
          version: ${{ needs.prepare.outputs.version }}
          archive-prefix: dotagent-${{ needs.prepare.outputs.version }}
          commit-message: "homebrew: bump dotagent to ${{ needs.prepare.outputs.version }}"
