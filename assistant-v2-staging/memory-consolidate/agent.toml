# memory-consolidate — nightly distillation of the day's conversation facts.
#
# The dispatcher (telegram-assistant) writes raw MEMO facts to the memory
# workspace all day. This agent, ~23h, reads the day's journal and reshapes
# it: topic pages get the day's facts gathered, open items (TODO) become
# first-class records that morning-briefing and follow-up-sweeper can query.
#
# Silent on success by design: consolidation is bookkeeping, not news. If it
# gives up, the telegram notifier fires and tomorrow's briefing runs on
# unconsolidated facts — degraded, not broken.

[agent]
name = "memory-consolidate"
description = "Destila o journal do dia em topic pages e pendências (TODO)."
timeout_seconds = 300

[run]
command = "fish"
args = ["/Users/avelino/dotfiles/modules/home-manager/dotagent/agents/memory-consolidate/agent.fish"]

[defaults]
max_retries = 2
retry_backoff_minutes = [10, 30]

[[schedules]]
id = "nightly"
type = "cron"
weekdays = [0, 1, 2, 3, 4, 5, 6]
hours = [23]
minute = 0

[[notifiers]]
driver = "telegram"
bot_token = "${TELEGRAM_BOT_TOKEN}"
chat_id = "2813445"
events = ["given_up"]
